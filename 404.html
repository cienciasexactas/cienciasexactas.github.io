<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Redirecionando...</title>
  <script>
    var path = window.location.pathname.replace(/^\//, '');
    if (path) {
      window.location.replace(window.location.origin + '/#' + path);
    } else {
      window.location.replace(window.location.origin);
    }
  </script>
</head>

<body></body>

</html>
