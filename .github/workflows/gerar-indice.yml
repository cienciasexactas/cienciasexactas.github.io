name: Gerar Índice de Trabalhos e Atividades

on:
  push:
    branches: ["main"]
    paths:
      - "www/Trabalhos/**"
      - "Trabalhos/**"
      - "actividades/**"
      - "colaborativos/**"
      - "grupo/**"
      - "publicacoes/**"
      - "scripts/gerar-indice.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gerar-indice"
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar índice JSON
        run: node scripts/gerar-indice.js

      - name: Commit índice atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: atualizar índice estático de trabalhos e atividades"
          git push